name: Update Profile Stats

# Keeps the profile README's stats fresh:
#   - regenerates activity-graph.svg and publishes it to the `profile-stats` branch
#   - rewrites the public repo count in README.md (commits only when it changed)
#   - purges GitHub's Camo image cache so the hosted stat cards re-fetch
# Uses only the built-in GITHUB_TOKEN, so no PAT or extra secrets are needed.

on:
  schedule:
    - cron: "17 */6 * * *" # every 6h (UTC); off the top of the hour, when GitHub delays scheduled runs most
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate activity graph and refresh README counts
        run: node .github/scripts/update-profile.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
          OUT_DIR: ${{ runner.temp }}/profile-stats

      - name: Publish SVGs to the profile-stats branch
        working-directory: ${{ runner.temp }}/profile-stats
        run: |
          git init -q -b profile-stats
          git add -A
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" \
            commit -qm "Update profile stats ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git push -fq "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:profile-stats

      - name: Commit README changes
        run: |
          if git diff --quiet -- README.md; then
            echo "README already up to date"
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git commit -qm "chore: update profile stats" -- README.md
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push -q origin "HEAD:$GITHUB_REF_NAME"

      # Camo caches each third-party image for as long as the origin's Cache-Control allows (24h for
      # streak-stats). Purging makes the next profile view fetch fresh cards. raw.githubusercontent.com
      # images (activity graph, snake) bypass Camo and refresh within 5 min on their own. The
      # profile-views counter (komarev) is left out on purpose: a forced re-fetch would count as a view.
      - name: Purge Camo cache for dynamic cards
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/readme" -H "Accept: application/vnd.github.html" \
            | grep -oE '<img [^>]*>' \
            | grep -E 'data-canonical-src="https://(github-readme-stats[^"]*\.vercel\.app/|streak-stats\.demolab\.com/|img\.shields\.io/github/)' \
            | grep -oE 'src="https://camo\.githubusercontent\.com/[^"]+"' | cut -d'"' -f2 | sort -u \
            | while read -r url; do
                if curl -fsS -X PURGE "$url" > /dev/null; then echo "purged ${url:0:80}…"; else echo "::warning::purge failed: $url"; fi
              done
